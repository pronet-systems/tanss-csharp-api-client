# ---------------------------------------------------------------------------
#  Der blockierende Lauf: jeder Push, jeder Pull Request.
#
#  Er bleibt bewusst schmal: wiederherstellen, uebersetzen, testen. Alle Tests
#  laufen ohne Netz gegen eine Attrappe - die Werkstrecke braucht keine
#  TANSS-Instanz.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Ein neuer Push auf denselben Zweig macht den vorigen Lauf gegenstandslos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  # Englische Werkzeugmeldungen im Protokoll: eine Compilermeldung sucht man
  # im Netz, und dort steht sie englisch.
  DOTNET_CLI_UI_LANGUAGE: 'en'
  # Der Paketzwischenspeicher liegt im Arbeitsverzeichnis statt unter ~, damit
  # actions/cache einen Pfad bekommt, der auf jedem Laeufer gleich heisst.
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget-packages

jobs:
  solution:
    name: Projektmappe bauen und testen
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v7

      - name: .NET 10 einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Paketzwischenspeicher
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Pakete wiederherstellen
        run: dotnet restore Tanss.Api.slnx

      - name: Übersetzen
        # -warnaserror doppelt zur Sicherheit: TreatWarningsAsErrors steht
        # bereits in Directory.Build.props.
        run: dotnet build Tanss.Api.slnx -c Release --no-restore -warnaserror

      - name: Tests
        # Ohne TANSS_BASE_URL/TANSS_USER/TANSS_PASSWORD ueberspringt sich das Projekt
        # Tanss.Api.Live.Tests selbst; die Werkstrecke braucht also keine Zugangsdaten.
        run: >-
          dotnet test Tanss.Api.slnx -c Release --no-build
          --logger "trx;LogFilePrefix=Tanss.Api"
          --results-directory artifacts/test-results

      - name: Testergebnisse sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testergebnisse
          path: artifacts/test-results/*.trx
          if-no-files-found: error
          retention-days: 14
